# MCUboot como bootloader (esto es config de SYSBUILD, no de la app)
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Modo de intercambio: swap-using-MOVE en vez del swap-using-OFFSET por
# defecto. El de offset espera la imagen secundaria desplazada un sector
# (8 KB en el WBA65) y la subida por SMP la escribe al principio -> el hash
# no cuadra y MCUboot borra la ranura. El de move es el clasico, no exige
# ese desplazamiento y conserva la reversion automatica.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
