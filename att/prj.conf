# Consola + logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# GPIO + SPI bit-bang
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_BITBANG=y

# Red / Ethernet / ADIN2111
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_ADIN2111=y
CONFIG_NET_LOG=y

# sin IP (mandaremos tramas L2 crudas al power switch)
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y

CONFIG_NET_RX_STACK_SIZE=2048

# Raw L2 Ethernet (AF_PACKET) para TX de tramas al power switch
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y

# --- diagnostico del PHY/MDIO (2026-07-15) ---
CONFIG_PHY_LOG_LEVEL_DBG=y
CONFIG_MDIO_LOG_LEVEL_DBG=y
CONFIG_ETHERNET_LOG_LEVEL_DBG=y

# RS485: recepcion por interrupcion. Con sondeo se pierden los bytes:
# un mensaje de 21 bytes a 115200 dura 1.8ms y el poll era cada 500ms
# -> solo sobrevivia 1 byte por mensaje en el registro del UART.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# IPv4 + cliente DHCP en los puertos SPE (servidor = la TPU, 192.168.50.1).
# El encoder SIGUE viajando en tramas L2 crudas (ethertype 0x88B5): la IP es
# para gestion/diagnostico, no toca el camino de datos ya validado.
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_ENTROPY_GENERATOR=y

# --- Modbus: la ATT (Varec) es ESCLAVO. La consulta la TPU. ---
# RTU por el RS-485 y TCP por el SPE, con el MISMO mapa de registros.
# Zephyr NO trae servidor Modbus TCP hecho: se usa MODBUS_RAW_ADU y el
# pegamento de sockets va en la app (igual que el sample tcp_server).
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_SERIAL=y
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1
CONFIG_NET_TCP=y
CONFIG_MODBUS_BUFFER_SIZE=256
CONFIG_MAIN_STACK_SIZE=8192

# EEPROM AT24C64 (I2C1 0x50): configuracion persistente en caliente
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y

CONFIG_NET_MAX_CONN=16

# ================= OTA: MCUboot + mcumgr/SMP sobre UDP =================
# Actualizacion desde la TPU por el propio enlace SPE. La imagen sube a
# slot1, se marca "a prueba" y MCUboot la intercambia; si la nueva imagen
# NO se autoconfirma, revierte sola en el siguiente arranque.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=n
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=6
CONFIG_SENSOR=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.2.0+0"

# MAC unica por placa: hwinfo lee el UID, ethernet_mgmt la fija
CONFIG_HWINFO=y
CONFIG_NET_L2_ETHERNET_MGMT=y
