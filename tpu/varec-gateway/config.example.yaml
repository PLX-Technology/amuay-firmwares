# Pasarela Varec — configuracion.
# Copiar a /etc/varec-gateway/config.yaml y ajustar.

# ------------------------------------------------------- nombres legibles
# Alias que se enseñan en el arbol publicado (MQTT y /api/arbol) en lugar del
# identificador crudo. Con 50 tanques nadie lee "mfs:881e316fef38f712".
#
# ⚠️ La clave es el ID ESTABLE del equipo, que sale del numero de serie del
# micro y NO cambia entre reinicios ni al recablear. NO uses la MAC: la de un
# field switch se sortea en cada arranque y el alias se despegaria solo.
#
# Los ids se sacan tal cual del propio arbol:
#     curl -s localhost:8080/api/arbol | grep -o '"id": "[^"]*"' | sort -u
#
# El campo `id` del documento NO cambia al poner un alias -- este solo afecta a
# `nombre`. Asi un consumidor correlaciona por `id` y enseña `nombre`, y
# renombrar un equipo no le rompe el historico.
#
# Un alias cuyo id no exista se ignora en silencio, pero sale listado en
# `resumen.alias_sin_usar` del arbol para que se note el error de escritura.
alias: {}
# alias:
#   "tpu:flcon01":            "TPU principal"
#   "mps:d708b5c9fd629c57":   "MPS sala de bombas"
#   "mfs:881e316fef38f712":   "MFS muelle 3"
#   "tanque:21":              "Tanque 21 - diesel"

# --------------------------------------------------------------- ingesta
ingest:
  # La interfaz SPE se detecta por DRIVER (adin1110), NUNCA por nombre:
  # los nombres eth1/eth2/eth3 se intercambian entre arranques en esta CM5.
  iface_driver: adin1110
  iface: ""                 # forzar un nombre concreto (deja vacio para autodetectar)
  ethertype: 0x88B5

  # Un tanque que lleva este tiempo sin reportar pasa a 'offline'.
  # Regla: 3 periodos + margen. Con push cada 30s -> 120s.
  offline_after_s: 120

  # SPE roto (OA-SPI del ADIN2111): poner en false para no arrancar el sniffer.
  enabled: true

# ------------------------------------------- ingesta por Modbus RTU (RS-485)
# Alternativa al SPE: la gateway hace de MAESTRO Modbus y consulta a la ATT
# (esclavo) por RS-485. Usa el nivel ya calibrado por la ATT (IR 7-8). Util
# cuando el SPE de la ATT no funciona. OJO: no habilitar a la vez modbus_rtu
# (salida esclavo) en el MISMO bus/puerto.
modbus_ingest:
  enabled: false
  device: /dev/ttyAMA2
  baud: 19200
  parity: E                 # N/E/O
  unit_id: 1
  poll_s: 2                 # periodo de consulta
  tank_id: 0                # fallback si la ATT reporta tank_id=0 (0 = ignorar)

# --------------------------------------------------- almacenamiento (SSD M.2)
store:
  # OJO: en el SSD, no en la eMMC. La eMMC es solo para el OS.
  path: /mnt/ssd/varec/varec.db

  retention:
    raw_days: 7             # muestras crudas
    minute_days: 90         # medias por minuto
    hour_days: 3650         # medias por hora (~10 años)

  # Guardar cada muestra cruda de 30+ tanques durante años no es viable
  # ni util. Ademas del periodo, se descarta lo que no aporta:
  deadband: 0.0             # 0 = guardar todo lo que llegue

# ------------------------------------------------------------- salidas
mqtt:
  enabled: false
  host: localhost
  port: 1883
  username: ""
  password: ""              # dejar vacio y usar VAREC_MQTT_PASS en el entorno
  topic_prefix: varec
  # publica en:  varec/<tank_id>/value  |  /status  |  /raw
  retain: true
  qos: 1
  # Arbol jerarquico de TODA la instalacion (TPU -> power switch -> field
  # switches encadenados -> tanques) en UN documento JSON, para que otro
  # software monitorice el conjunto sin recomponer la topologia por su cuenta.
  # Se publica RETENIDO: quien se suscriba a mitad lo recibe al instante.
  # El MISMO documento esta en HTTP en /api/arbol.
  arbol_topic: ""             # vacio = <topic_prefix>/topologia
  arbol_periodo_s: 10         # la topologia cambia poco; 10 s da reaccion de sobra
  # ---- ordenes desde la sala de visualizacion ----
  # La sala PIDE la calibracion; la TPU es la UNICA que escribe, y republica la
  # vigente en el arbol retenido (campo `calibracion` de cada tanque). Asi no
  # hay dos copias del dato que puedan discrepar: la sala muestra lo que la TPU
  # confirma, y da igual cuantas salas haya o que alguien calibre desde el panel.
  #
  # Orden (JSON). DOS formas de decir la misma recta:
  #
  # a) "geometrica" -- la practica en campo, NO hay que mover producto:
  #      {"id":"sala-001", "tank_id":7, "modo":"geometrica", "unidad":"mm",
  #       "mm_por_pulso":0.595312, "altura_referencia":12000, "sentido":"baja"}
  #
  #    mm_por_pulso es una constante MECANICA del cabezal. El manual del Varec
  #    2500 (IOM001 rev I) no publica el perimetro del pinon, pero si la escala
  #    del cuadrante, que cuelga del mismo eje (p. 56-57): una vuelta = 1 ft en
  #    cabezal INGLES (dos ruedas contadoras) o 100 mm en METRICO (tres
  #    ruedas). Con 512 cuentas de encoder por vuelta:
  #       ingles   304.8/512 = 0.595312 mm/pulso
  #       metrico  100.0/512 = 0.195313 mm/pulso
  #    altura_referencia es la cota del CERO del contador, medible con cinta.
  #    sentido: "baja" (por defecto) = suben los pulsos, baja el nivel.
  #
  # b) "dos_puntos" (lo que se asume si no viene `modo`) -- exacto, pero exige
  #    MOVER el flotador entre dos niveles conocidos:
  #      {"id":"lo-que-sea", "tank_id":21, "unidad":"mm",
  #       "punto_a":{"pulsos":848,"nivel":1000},
  #       "punto_b":{"pulsos":7823,"nivel":2000}}
  #
  # Respuesta en res_topic, SIN retener:
  #   {"id":..., "tank_id":21, "estado":"aplicada"|"rechazada",
  #    "motivo":"...", "escala":..., "offset":..., "aviso":"..."}
  #
  # ⚠️ Topicos SEPARADOS de los de datos para que el broker pueda dar permiso
  # de publicar aqui SOLO a la sala, y de leer a todo lo demas. Ver
  # despliegue/acl_mqtt.sh
  cmd_topic: ""               # vacio = <topic_prefix>/cmd/calibrar
  res_topic: ""               # vacio = <topic_prefix>/cmd/resultado

modbus_tcp:
  enabled: true
  bind: 0.0.0.0
  port: 502
  unit_id: 1

modbus_rtu:
  enabled: false
  # OJO: la TPU tiene UN solo puerto RS-485. Si se usa para SERVIR al SCADA,
  # no puede a la vez ser maestro de las ATT por ese bus. La ingesta va por
  # SPE, asi que el RS-485 queda libre como salida.
  device: /dev/ttyAMA2
  baud: 19200
  parity: E                 # 19200 8E1 = el default del estandar Modbus
  unit_id: 1

http:
  enabled: true
  bind: 0.0.0.0
  port: 8080

# ------------------------------------------------------------- tanques
# El tank_id lo lleva cada ATT en su EEPROM y viaja en la trama. Aqui solo
# se le pone etiqueta y escala; si un tanque no aparece, se auto-registra.
tanks:
  - tank_id: 1
    name: "Tanque 1"
    scale: 1.0              # pulsos del encoder -> unidad de ingenieria
    offset: 0.0
    unit: mm
