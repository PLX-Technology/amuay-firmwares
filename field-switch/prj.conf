CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_EXTENDED_MODES=y
# CONFIG_USERSPACE=y
CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_KERNEL_MEM_POOL=y
CONFIG_HEAP_MEM_POOL_SIZE=30000
CONFIG_MAIN_STACK_SIZE=30000
CONFIG_IDLE_STACK_SIZE=5000

CONFIG_SENSOR=y
CONFIG_LTC4296=y

# -- disable code optimization so we can debug
# CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_EXCEPTION_STACK_TRACE=y
# CONFIG_DEBUG_INFO=y
CONFIG_MAIN_THREAD_PRIORITY=2
CONFIG_ASSERT=y
CONFIG_DEBUG_THREAD_INFO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SENSOR_LOG_LEVEL_INF=y

CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_THREAD_NAME=y
CONFIG_FLASH_LOAD_OFFSET=0x100
CONFIG_INIT_ARCH_HW_AT_BOOT=y
CONFIG_SRAM_VECTOR_TABLE=n

# --- PRODUCCION 2026-08-04 ------------------------------------------------
# Nivel 3 (INFO), no 4 (DEBUG). Con DEBUG en modo inmediato la placa escupia
# ~330 KB cada 2 min de trazas de mutex y SPI, bloqueando el procesador en cada
# linea a 115200. Dos consecuencias medidas, no teoricas:
#   - el hilo lector de SPI se comia el 42 % de CPU;
#   - ese diluvio CORROMPE la fase de conexion del grabado por serie
#     (`expected data size != real one`), o sea que el propio firmware sabotea
#     la via por la que hay que recuperar un field switch en campo.
#
# Centinela de pila: patron al final de cada pila, comprobado en cada cambio de
# contexto. Barato, y convierte un desbordamiento -- que hoy seria un CUELGUE
# MUDO -- en un mensaje con nombre de hilo. Medido 2026-08-04: ninguna pila
# pasa del 41 %, asi que no es la causa del cuelgue conocido, pero se queda
# como red de seguridad para las 50 unidades.
# THREAD_ANALYZER se deja FUERA: es diagnostico de banco, no de campo.
CONFIG_STACK_SENTINEL=y
